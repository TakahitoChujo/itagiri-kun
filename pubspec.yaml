name: itagiri_kun
description: DIY木材カット計算アプリ - 端材を最小にする最適カット配置を自動計算
publish_to: 'none'
version: 1.3.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.20.2
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  pdf: ^3.11.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

# アイコン生成設定（flutter pub run flutter_launcher_icons で実行）
# 事前に assets/icon/icon.png（1024x1024）を用意してください
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#8B6914"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: false

# スプラッシュ生成設定（flutter pub run flutter_native_splash:create で実行）
# 事前に assets/splash/splash.png を用意してください（推奨: 200x200 以上）
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash.png
  android_12:
    icon_background_color: "#FFFFFF"
  fullscreen: false
