<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B4F10"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <clipPath id="screenClip5">
      <rect x="145" y="580" width="1000" height="1900" rx="20"/>
    </clipPath>
    <clipPath id="phoneClip5">
      <rect x="120" y="520" width="1050" height="2020" rx="60"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1290" height="2796" fill="#FAF8F5"/>
  <rect width="1290" height="460" fill="url(#bgGrad5)"/>
  <rect y="400" width="1290" height="120" fill="url(#bgGrad5)" opacity="0.3"/>

  <!-- Catchcopy -->
  <text x="645" y="180" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="4">
    細かい設定もおまかせ
  </text>
  <text x="645" y="280" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="42" font-weight="400" fill="#FFFFFF" opacity="0.85">
    あなた好みにカスタマイズできます
  </text>

  <!-- App icon badge -->
  <rect x="540" y="340" width="210" height="70" rx="35" fill="#2E7D32"/>
  <text x="645" y="386" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="700" fill="#FFF">
    板取りくん
  </text>

  <!-- Phone Frame -->
  <rect x="120" y="520" width="1050" height="2020" rx="60" fill="#1a1a1a" filter="url(#shadow1)"/>
  <rect x="135" y="535" width="1020" height="1990" rx="52" fill="#2a2a2a"/>
  <rect x="145" y="565" width="1000" height="1960" rx="44" fill="#FAF8F5"/>

  <!-- Status bar -->
  <g clip-path="url(#phoneClip5)">
    <rect x="145" y="565" width="1000" height="88" fill="#8B6914"/>
    <!-- Time -->
    <text x="200" y="620" font-family="'SF Pro', 'Helvetica', sans-serif" font-size="32" font-weight="600" fill="#FFF">9:41</text>
    <!-- Signal icons -->
    <rect x="1000" y="598" width="28" height="28" rx="4" fill="#FFF" opacity="0.9"/>
    <rect x="1035" y="602" width="28" height="24" rx="4" fill="#FFF" opacity="0.9"/>
    <rect x="1070" y="606" width="28" height="20" rx="4" fill="#FFF" opacity="0.9"/>
    <!-- Dynamic island -->
    <rect x="520" y="575" width="250" height="36" rx="18" fill="#000"/>
  </g>

  <!-- App bar -->
  <rect x="145" y="653" width="1000" height="110" fill="#8B6914"/>
  <!-- Back arrow -->
  <line x1="210" y1="708" x2="230" y2="688" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="708" x2="230" y2="728" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
  <text x="645" y="724" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="44" font-weight="700" fill="#FFF">
    設定
  </text>

  <!-- Content area -->
  <g clip-path="url(#screenClip5)">

    <!-- ========== Section: 計算設定 ========== -->
    <text x="200" y="820" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#8B6914" letter-spacing="2">
      計算設定
    </text>
    <rect x="185" y="838" width="920" height="2" fill="#8B6914" opacity="0.15"/>

    <!-- Row: カーフ幅 -->
    <rect x="185" y="860" width="920" height="160" rx="20" fill="#FFFFFF" filter="url(#shadow2)"/>
    <!-- Icon: saw blade -->
    <rect x="220" y="890" width="60" height="60" rx="14" fill="#FFF3E0"/>
    <rect x="234" y="907" width="32" height="6" rx="3" fill="#8B6914"/>
    <polygon points="234,913 239,922 244,913 249,922 254,913 259,922 264,913" fill="#8B6914" opacity="0.7"/>
    <rect x="234" y="922" width="32" height="16" rx="2" fill="#8B6914" opacity="0.3"/>
    <text x="300" y="920" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="600" fill="#333">
      カーフ幅（のこぎり刃の厚み）
    </text>
    <text x="300" y="958" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24" fill="#999">
      カット計算時に刃の厚みを考慮します
    </text>

    <!-- Slider track -->
    <rect x="300" y="980" width="620" height="10" rx="5" fill="#E8E0D0"/>
    <!-- Slider filled portion -->
    <rect x="300" y="980" width="186" height="10" rx="5" fill="#8B6914"/>
    <!-- Slider thumb -->
    <circle cx="486" cy="985" r="18" fill="#FFFFFF" stroke="#8B6914" stroke-width="3" filter="url(#shadow2)"/>

    <!-- Value display -->
    <rect x="940" y="890" width="130" height="55" rx="12" fill="#F5F0E6" stroke="#D0C8B8" stroke-width="1.5"/>
    <text x="1005" y="928" text-anchor="middle" font-family="'SF Pro', 'Helvetica', sans-serif" font-size="32" font-weight="700" fill="#8B6914">1.5</text>
    <text x="1070" y="928" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="22" fill="#999">mm</text>

    <!-- Row: 単位設定 -->
    <rect x="185" y="1040" width="920" height="120" rx="20" fill="#FFFFFF" filter="url(#shadow2)"/>
    <!-- Icon: ruler -->
    <rect x="220" y="1062" width="60" height="60" rx="14" fill="#E8F5E9"/>
    <rect x="238" y="1072" width="6" height="40" rx="3" fill="#2E7D32"/>
    <rect x="244" y="1080" width="10" height="3" rx="1" fill="#2E7D32"/>
    <rect x="244" y="1090" width="7" height="3" rx="1" fill="#2E7D32"/>
    <rect x="244" y="1100" width="10" height="3" rx="1" fill="#2E7D32"/>
    <text x="300" y="1102" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="600" fill="#333">
      単位設定
    </text>
    <text x="300" y="1138" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24" fill="#999">
      長さの表示単位を切り替えます
    </text>
    <!-- Toggle buttons: mm / cm -->
    <rect x="860" y="1068" width="210" height="56" rx="28" fill="#F0EBE0"/>
    <!-- mm button (selected) -->
    <rect x="864" y="1072" width="100" height="48" rx="24" fill="#8B6914"/>
    <text x="914" y="1104" text-anchor="middle" font-family="'SF Pro', 'Helvetica', sans-serif" font-size="26" font-weight="700" fill="#FFF">mm</text>
    <!-- cm button (unselected) -->
    <text x="1016" y="1104" text-anchor="middle" font-family="'SF Pro', 'Helvetica', sans-serif" font-size="26" font-weight="600" fill="#999">cm</text>

    <!-- ========== Section: 表示設定 ========== -->
    <text x="200" y="1230" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#8B6914" letter-spacing="2">
      表示設定
    </text>
    <rect x="185" y="1248" width="920" height="2" fill="#8B6914" opacity="0.15"/>

    <!-- Row: テーマ -->
    <rect x="185" y="1270" width="920" height="120" rx="20" fill="#FFFFFF" filter="url(#shadow2)"/>
    <!-- Icon: palette -->
    <rect x="220" y="1292" width="60" height="60" rx="14" fill="#FFF8E1"/>
    <circle cx="244" cy="1316" r="8" fill="#FFB74D"/>
    <circle cx="260" cy="1308" r="6" fill="#81C784"/>
    <circle cx="260" cy="1328" r="6" fill="#64B5F6"/>
    <text x="300" y="1332" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="600" fill="#333">
      テーマ
    </text>
    <text x="300" y="1368" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24" fill="#999">
      アプリの外観を変更します
    </text>
    <!-- Toggle buttons: ライト / ダーク -->
    <rect x="810" y="1298" width="260" height="56" rx="28" fill="#F0EBE0"/>
    <!-- ライト button (selected) -->
    <rect x="814" y="1302" width="125" height="48" rx="24" fill="#8B6914"/>
    <text x="876" y="1334" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24" font-weight="700" fill="#FFF">ライト</text>
    <!-- ダーク button (unselected) -->
    <text x="1003" y="1334" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#999">ダーク</text>

    <!-- ========== Section: このアプリについて ========== -->
    <text x="200" y="1460" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#8B6914" letter-spacing="2">
      このアプリについて
    </text>
    <rect x="185" y="1478" width="920" height="2" fill="#8B6914" opacity="0.15"/>

    <!-- Row: オープンソースライセンス -->
    <rect x="185" y="1500" width="920" height="100" rx="20" fill="#FFFFFF" filter="url(#shadow2)"/>
    <!-- Icon: document -->
    <rect x="220" y="1518" width="60" height="60" rx="14" fill="#E3F2FD"/>
    <rect x="238" y="1530" width="26" height="34" rx="4" fill="none" stroke="#1976D2" stroke-width="2.5"/>
    <rect x="243" y="1540" width="16" height="3" rx="1" fill="#1976D2" opacity="0.5"/>
    <rect x="243" y="1547" width="12" height="3" rx="1" fill="#1976D2" opacity="0.5"/>
    <rect x="243" y="1554" width="16" height="3" rx="1" fill="#1976D2" opacity="0.5"/>
    <text x="300" y="1562" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="600" fill="#333">
      オープンソースライセンス
    </text>
    <!-- Chevron right -->
    <line x1="1065" y1="1535" x2="1085" y2="1550" stroke="#CCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="1085" y1="1550" x2="1065" y2="1565" stroke="#CCC" stroke-width="3" stroke-linecap="round"/>

    <!-- Row: バージョン情報 -->
    <rect x="185" y="1620" width="920" height="100" rx="20" fill="#FFFFFF" filter="url(#shadow2)"/>
    <!-- Icon: info -->
    <rect x="220" y="1638" width="60" height="60" rx="14" fill="#F3E5F5"/>
    <circle cx="250" cy="1668" r="14" fill="none" stroke="#7B1FA2" stroke-width="2.5"/>
    <text x="250" y="1676" text-anchor="middle" font-family="'SF Pro', 'Helvetica', sans-serif" font-size="18" font-weight="700" fill="#7B1FA2">i</text>
    <text x="300" y="1680" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="600" fill="#333">
      バージョン情報
    </text>
    <!-- Version badge -->
    <rect x="940" y="1650" width="130" height="44" rx="22" fill="#F5F0E6"/>
    <text x="1005" y="1681" text-anchor="middle" font-family="'SF Pro', 'Helvetica', sans-serif" font-size="26" font-weight="600" fill="#8B6914">v1.0.0</text>

    <!-- Row: お問い合わせ -->
    <rect x="185" y="1740" width="920" height="100" rx="20" fill="#FFFFFF" filter="url(#shadow2)"/>
    <!-- Icon: mail -->
    <rect x="220" y="1758" width="60" height="60" rx="14" fill="#E8F5E9"/>
    <rect x="236" y="1776" width="30" height="20" rx="4" fill="none" stroke="#2E7D32" stroke-width="2.5"/>
    <line x1="236" y1="1778" x2="251" y2="1790" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="266" y1="1778" x2="251" y2="1790" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
    <text x="300" y="1800" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="32" font-weight="600" fill="#333">
      お問い合わせ
    </text>
    <!-- Chevron right -->
    <line x1="1065" y1="1775" x2="1085" y2="1790" stroke="#CCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="1085" y1="1790" x2="1065" y2="1805" stroke="#CCC" stroke-width="3" stroke-linecap="round"/>

    <!-- ========== Footer info ========== -->
    <text x="645" y="1930" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24" fill="#BBB">
      板取りくん - かんたん木材カット最適化
    </text>
    <text x="645" y="1970" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="22" fill="#CCC">
      Made with care for DIY enthusiasts
    </text>

    <!-- App logo mini -->
    <rect x="600" y="2010" width="90" height="60" rx="12" fill="#FAF8F5" stroke="#E0D8C8" stroke-width="1.5"/>
    <rect x="616" y="2022" width="58" height="6" rx="3" fill="#8B6914" opacity="0.5"/>
    <polygon points="616,2028 622,2036 628,2028 634,2036 640,2028 646,2036 652,2028 658,2036 664,2028 670,2036 674,2028" fill="#8B6914" opacity="0.35"/>
    <rect x="616" y="2036" width="58" height="22" rx="2" fill="#8B6914" opacity="0.15"/>

  </g>

  <!-- Bottom nav -->
  <rect x="145" y="2405" width="1000" height="120" fill="#FFFFFF"/>
  <line x1="145" y1="2405" x2="1145" y2="2405" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Home tab -->
  <rect x="245" y="2420" width="8" height="8" fill="#999"/>
  <rect x="230" y="2430" width="40" height="30" rx="4" fill="none" stroke="#999" stroke-width="3"/>
  <rect x="245" y="2440" width="10" height="16" fill="#999"/>
  <text x="250" y="2495" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="22" fill="#999">ホーム</text>
  <!-- History tab -->
  <circle cx="645" cy="2445" r="18" fill="none" stroke="#999" stroke-width="3"/>
  <line x1="645" y1="2445" x2="645" y2="2432" stroke="#999" stroke-width="3"/>
  <line x1="645" y1="2445" x2="656" y2="2445" stroke="#999" stroke-width="3"/>
  <text x="645" y="2495" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="22" fill="#999">履歴</text>
  <!-- Settings tab (active) -->
  <circle cx="1040" cy="2445" r="18" fill="none" stroke="#8B6914" stroke-width="3"/>
  <circle cx="1040" cy="2445" r="6" fill="#8B6914"/>
  <text x="1040" y="2495" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="22" font-weight="700" fill="#8B6914">設定</text>

  <!-- Home indicator -->
  <rect x="520" y="2490" width="250" height="8" rx="4" fill="#1a1a1a" opacity="0.2"/>
</svg>